name: ci

# Everything here is offline: no credentials, no network beyond npm install.
# The live gateway smoke test (test/live.test.mjs) is opt-in via
# DSH_WEB_SEARCH_LIVE=1 and deliberately never runs in CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Host syntax + client typecheck
        run: npm run check
      - name: Locale parity
        run: npm run check-locales
      - name: Unit tests
        run: npm test
      - name: The committed client bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- lib/client.js

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pack and inspect the published file set
        run: |
          npm pack --dry-run
          test -f lib/client.js
